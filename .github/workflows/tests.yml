name: Cross-Platform Tests

on:
  push:
    branches: [pre-release]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
  pull_request:
    branches: [pre-release]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'

jobs:
  test:
    name: Run Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v5
        with:
          branch: pre-release

      - name: 📦 Checkout Hexo Starter (as tmp/site)
        uses: actions/checkout@v5
        with:
          repository: hexojs/hexo-starter
          path: tmp/site

      - name: 📦 Checkout Hexo Theme Light (as tmp/site/themes/light)
        uses: actions/checkout@v5
        with:
          repository: hexojs/hexo-theme-light
          path: tmp/site/themes/light

      - name: 📦 Checkout dimaslanjaka/site (hexo-seo branch, site)
        uses: actions/checkout@v5
        with:
          repository: dimaslanjaka/site
          path: site
          ref: hexo-seo

      - name: 📦 Checkout dimaslanjaka/site (hexo-seo branch, tmp/site)
        uses: actions/checkout@v5
        with:
          repository: dimaslanjaka/site
          path: tmp/site
          ref: hexo-seo

      - name: 📦 Set up Git Config
        run: |
          git config --global user.name "dimaslanjaka"
          git config --global user.email "dimaslanjaka@gmail.com"

      - name: 🔧 Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔄 Update and Sync Git Submodules
        continue-on-error: true
        run: |
          git submodule update --init --recursive
          git submodule update --recursive --remote
          git pull -X theirs
          echo "init submodules"
          git submodule init
          git submodule foreach "git submodule init"
          echo "sync submodules"
          git submodule sync
          git submodule foreach "git submodule sync"
          echo "update submodules"
          mkdir -p bin >/dev/null 2>&1
          npm install -g rimraf binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz
          npx rimraf .git/modules
          npx submodule-install

      - name: Get Yarn cache folder
        id: yarn-cache
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> $GITHUB_ENV

      - name: 📦 Cache Yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.cacheFolder }}
            **/node_modules
            **/.yarn/cache
            **/.yarn/unplugged
            **/.yarn/build-state.yml
            **/.yarn/install-state.gz
            **/.pnp.*
            **/dist
            **/tmp
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock', 'test/**/*.ts', 'test/**/*.js', 'test/**/*.cjs', 'test/**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 📦 Install Node.js Dependencies
        run: yarn install

      - name: 🛠️ Run Yarn Prepare
        run: yarn prepare

      - name: �🛠️ Build Workspace
        run: npm run build

      - name: 🧪 Run Test Suite
        run: npm test

      - name: 🧹 Clean GitHub Actions Caches
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: npx clean-github-actions-caches
