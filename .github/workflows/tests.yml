name: Cross-Platform Tests

on:
  push:
    branches: [ pre-release ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
  pull_request:
    branches: [ pre-release ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'

jobs:
  test:
    name: Run Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          branch: pre-release

      - name: 📦 Set up Git Config
        run: |
          git config --global user.name "dimaslanjaka"
          git config --global user.email "dimaslanjaka@gmail.com"

      - name: 🔧 Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⬇️ Clone Hexo Site (hexo-seo branch)
        run: git clone --branch hexo-seo https://github.com/dimaslanjaka/site site
      - name: Get Yarn cache folder
        id: yarn-cache
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> $GITHUB_ENV

      - name: 📦 Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.cacheFolder }}
            **/node_modules
            **/.yarn/cache
            **/.yarn/unplugged
            **/.yarn/build-state.yml
            **/.yarn/install-state.gz
            **/.pnp.*
            **/dist
            **/tmp
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock', 'src', 'test') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 📦 Install Node.js Dependencies
        run: yarn install

      - name: � Run Yarn Prepare
        run: yarn prepare

      - name: �🛠️ Build Workspace
        run: npm run build

      - name: 🧪 Run Test Suite
        run: npm test
